<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Benessere Completo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --success: #059669;
      --success-light: #d1fae5;
      --border: #e5e7eb;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --surface-1: #f9fafb;
      --surface-2: #ffffff;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f3f4f6;
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    
    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .grid-themes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 2rem;
    }
    
    .theme-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .theme-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .theme-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    
    .theme-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .theme-card .emoji {
      font-size: 28px;
      margin-bottom: 0.5rem;
    }
    
    .theme-card .title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    
    .theme-card .status {
      font-size: 12px;
      color: var(--success);
      margin-top: 0.5rem;
    }
    
    .panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    
    .panel-header {
      margin-bottom: 1.5rem;
    }
    
    .panel-header h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--surface-1);
      border-radius: 2px;
      margin: 1.5rem 0;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    
    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    
    .question {
      opacity: 1;
      transition: opacity 0.2s;
    }
    
    .question label {
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 500;
      font-size: 15px;
    }
    
    .question.unanswered {
      opacity: 0.6;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .button-group.grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }
    
    button {
      padding: 10px 12px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
      transition: all 0.2s;
      text-align: center;
    }
    
    button:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    
    button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 500;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      min-height: 80px;
      resize: none;
      font-weight: 400;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    input[type="range"] {
      width: 100%;
    }
    
    .range-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .range-value {
      font-size: 18px;
      font-weight: 500;
      min-width: 30px;
    }
    
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 2rem;
      justify-content: space-between;
    }
    
    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 500;
    }
    
    button.primary:hover {
      background: #1d4ed8;
    }
    
    button.secondary {
      background: var(--surface-1);
      border-color: var(--border);
    }
    
    .footer-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .report-view {
      display: none;
    }
    
    .report-view.active {
      display: block;
    }
    
    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 2rem;
    }
    
    .report-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    
    .report-card .emoji {
      font-size: 24px;
      margin-bottom: 0.5rem;
    }
    
    .report-card .title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    
    .report-card .status {
      font-size: 12px;
      color: var(--success);
    }
    
    .status-incomplete {
      color: var(--text-muted);
    }
    
    .success-banner {
      background: var(--success-light);
      border: 1px solid var(--success);
      border-radius: 12px;
      padding: 1.5rem;
      color: var(--success);
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .success-banner strong {
      display: block;
      font-size: 16px;
      margin-bottom: 0.5rem;
    }
    
    .success-banner p {
      font-size: 14px;
    }
  </style>
</head>

          { q: 'Quale è l\'impatto psicologico su di te?', type: 'select', options: ['Nessuno', 'Piccolo fastidio', 'Preoccupazione costante', 'Importante'] },
          { q: 'La tua famiglia ha storia di capillari?', type: 'select', options: ['No', 'Sì, un po\'', 'Sì, molto', 'Non so'] },
          { q: 'Quali fattori ti accorgi che li peggiorano?', type: 'select', options: ['Calore', 'Stare in piedi', 'Alcol', 'Ciclo mestruale', 'Gravidanza', 'Altro', 'Non so'] },
          { q: 'Conosci le opzioni di trattamento?', type: 'select', options: ['Nessuna', 'Qualcuna', 'Bene', 'Ho fatto consultazioni'] },
          { q: 'Quale tipo di intervento ti interesserebbe?', type: 'select', options: ['Laser', 'Scleroterapia', 'Radiofrequenza', 'Prodotti topici', 'Non lo so', 'Nessuno per ora'] },
          { q: 'Budget per trattamento?', type: 'select', options: ['0-200€', '200-500€', '500-1000€', '1000+€'] },
          { q: 'Timeline desiderata?', type: 'select', options: ['Subito', 'Entro 3 mesi', 'Entro 6 mesi', 'Entro 1 anno'] }
        ]
      };

      useEffect(() => {
        const saved = localStorage.getItem('wellnessResponses');
        if (saved) setResponses(JSON.parse(saved));
      }, []);

      useEffect(() => {
        localStorage.setItem('wellnessResponses', JSON.stringify(responses));
      }, [responses]);

      const handleResponse = (questionIndex, value) => {
        const themeId = themes[currentTheme].id;
        const newResponses = { ...responses };
        if (!newResponses[themeId]) newResponses[themeId] = {};
        newResponses[themeId][questionIndex] = value;
        setResponses(newResponses);
      };

      const allQuestionsAnswered = responses[themes[currentTheme].id] && 
        Object.keys(responses[themes[currentTheme].id]).length === questions[themes[currentTheme].id].length;

      const canContinue = currentTheme < themes.length - 1;

      const allThemesAnswered = themes.every(theme => 
        responses[theme.id] && Object.keys(responses[theme.id]).length === questions[theme.id].length
      );

      const renderQuestion = (q, index) => {
        const themeId = themes[currentTheme].id;
        const value = responses[themeId]?.[index] ?? '';

        if (q.type === 'yesno') {
          return (
            <div className="button-group">
              <button className={value === 'sì' ? 'active' : ''} onClick={() => handleResponse(index, 'sì')}>Sì</button>
              <button className={value === 'no' ? 'active' : ''} onClick={() => handleResponse(index, 'no')}>No</button>
            </div>
          );
        }

        if (q.type === 'select') {
          return (
            <div className="button-group grid">
              {q.options.map(opt => (
                <button key={opt} className={value === opt ? 'active' : ''} onClick={() => handleResponse(index, opt)}>
                  {opt}
                </button>
              ))}
            </div>
          );
        }

        if (q.type === 'number') {
          return (
            <div className="range-container">
              <input type="range" min={q.min} max={q.max} value={value || q.min} 
                onChange={e => handleResponse(index, e.target.value)} />
              <span className="range-value">{value || q.min}</span>
            </div>
          );
        }

        if (q.type === 'text') {
          return (
            <textarea value={value} onChange={e => handleResponse(index, e.target.value)} placeholder="Scrivi la tua risposta..." />
          );
        }
      };

      const ThemeCard = ({ theme, index }) => {
        const isActive = index === currentTheme;
        const isCompleted = responses[theme.id] && Object.keys(responses[theme.id]).length === questions[theme.id].length;
        const isDisabled = index > currentTheme;

        return (
          <div 
            className={`theme-card ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`}
            onClick={() => !isDisabled && setCurrentTheme(index)}
          >
            <div className="emoji">{theme.emoji}</div>
            <div className="title">{theme.title}</div>
            {isCompleted && <div className="status">✓ Completato</div>}
          </div>
        );
      };

      if (showReport) {
        return (
          <div>
            <div className="header">
              <h1>Report Finale</h1>
              <p>Analisi completa del percorso</p>
            </div>

            <div className="report-grid">
              {themes.map((theme, i) => {
                const answered = responses[theme.id] && Object.keys(responses[theme.id]).length === questions[theme.id].length;
                return (
                  <div key={theme.id} className="report-card">
                    <div className="emoji">{theme.emoji}</div>
                    <div className="title">{theme.title}</div>
                    <div className={`status ${answered ? '' : 'status-incomplete'}`}>
                      {answered ? '✓ Completo' : 'Incompleto'}
                    </div>
                  </div>
                );
              })}
            </div>

            {allThemesAnswered && (
              <div className="success-banner">
                <strong>✓ Assessment Completo!</strong>
                <p>Tutte le sezioni sono state completate. Pronta per creare i piani d'azione personalizzati!</p>
              </div>
            )}

            <div style={{ textAlign: 'center', gap: '12px', display: 'flex', justifyContent: 'center', marginTop: '2rem' }}>
              <button className="secondary" onClick={() => setShowReport(false)}>← Torna all'assessment</button>
              <button className="primary" onClick={() => {
                const data = JSON.stringify(responses, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `wellness-assessment-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
              }}>↓ Scarica Risposte JSON</button>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="grid-themes">
            {themes.map((theme, i) => (
              <ThemeCard key={theme.id} theme={theme} index={i} />
            ))}
          </div>

          <div className="panel">
            <div className="panel-header">
              <h2>{themes[currentTheme].emoji} {themes[currentTheme].title}</h2>
              <p style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                Domanda {Object.keys(responses[themes[currentTheme].id] || {}).length} di {questions[themes[currentTheme].id].length}
              </p>
            </div>

            <div className="progress-bar">
              <div className="progress-fill" style={{
                width: `${(Object.keys(responses[themes[currentTheme].id] || {}).length / questions[themes[currentTheme].id].length) * 100}%`
              }} />
            </div>

            <div className="questions-container">
              {questions[themes[currentTheme].id].map((q, idx) => (
                <div key={idx} className={`question ${responses[themes[currentTheme].id]?.[idx] !== undefined ? '' : 'unanswered'}`}>
                  <label>{idx + 1}. {q.q}</label>
                  {renderQuestion(q, idx)}
                </div>
              ))}
            </div>

            <div className="button-row">
              <button 
                className="secondary"
                onClick={() => currentTheme > 0 && setCurrentTheme(currentTheme - 1)}
                disabled={currentTheme === 0}
              >
                ← Indietro
              </button>

              {currentTheme === themes.length - 1 ? (
                <button 
                  className="primary"
                  onClick={() => allThemesAnswered && setShowReport(true)}
                  disabled={!allThemesAnswered}
                >
                  Genera Report →
                </button>
              ) : (
                <button 
                  className="primary"
                  onClick={() => allQuestionsAnswered && canContinue && setCurrentTheme(currentTheme + 1)}
                  disabled={!allQuestionsAnswered || !canContinue}
                >
                  Avanti →
                </button>
              )}
            </div>
          </div>

          <div className="footer-text">
            Progresso totale: {themes.filter(t => responses[t.id] && Object.keys(responses[t.id]).length === questions[t.id].length).length}/{themes.length}
          </div>
        </div>
      );
    };

    ReactDOM.render(<WellnessAssessment />, document.getElementById('app-root'));
  </script>
</body>
</html>
