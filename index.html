      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      transition: all 0.3s;
    }
    
    .tab-button.active {

    }
    
    .step-number {
      font-weight: 700;
      color: var(--secondary);
      font-size: 14px;

    }
    
    .step-details h4 {
      font-size: 13px;

      margin-bottom: 3px;

    .step-details p {

      margin-bottom: 2rem;

    .shopping-item {

    .shopping-item-info h4 {

      font-weight: 600;
      margin-bottom: 3px;
    }
    
    .shopping-item-info p {
      font-size: 11px;
      color: var(--text-secondary);
    }
    
    .checkbox {

      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;

      transition: all 0.3s;

    .checkbox.checked {

    .tracking-section {

    .tracking-card h3 {

      margin-bottom: 1rem;

    .tracking-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 0.75rem;
      background: var(--surface-1);
    }
    
    .tracking-input:focus {

      border-color: var(--primary);

    .week-indicator {
      background: linear-gradient(135deg, var(--warning), #fbbf24);
      color: white;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    
    .footer {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>

    const supplements = [
      { id: 1, name: 'Omega-3', dose: '1500mg', time: 'Pranzo', icon: '🐟' },
      { id: 2, name: 'Vitamina D3', dose: '2000 IU', time: 'Colazione', icon: '☀️' },

    const skincareRoutine = {

        { step: 1, action: 'Detergere', product: 'Gentle Cleanser sensibile (CeraVe, Eucerin)', time: '1 min' },

    const App = () => {
      const [currentTab, setCurrentTab] = useState('dieta');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [tracking, setTracking] = useState({});
      const [supplements_done, setSupplementsDone] = useState({});

      useEffect(() => {
        const saved = localStorage.getItem('moglie4weeks');
        if (saved) setTracking(JSON.parse(saved));
        const savedSupp = localStorage.getItem('moglie_supplements');
        if (savedSupp) setSupplementsDone(JSON.parse(savedSupp));
      }, []);

      useEffect(() => {
        localStorage.setItem('moglie4weeks', JSON.stringify(tracking));
      }, [tracking]);

      useEffect(() => {
        localStorage.setItem('moglie_supplements', JSON.stringify(supplements_done));
      }, [supplements_done]);

      const getDateIndex = () => {
        const start = new Date('2026-07-28');
        const current = new Date(selectedDate);
        const diff = Math.floor((current - start) / (1000 * 60 * 60 * 24)) + 1;
        return Math.max(1, Math.min(28, diff));
      };

      const dateIndex = getDateIndex();
      const dayMeals = meal28Days[dateIndex] || meal28Days[1];
      const week = Math.ceil(dateIndex / 7);

      const getMealRecipe = (type, id) => recipes[type]?.find(r => r.id === id);

      const getDailyTotal = () => {
        let totals = { p: 0, c: 0, f: 0, k: 0 };
        ['breakfast', 'snack1', 'lunch', 'snack2', 'dinner'].forEach(type => {
          const recipe = getMealRecipe(type, dayMeals[type]);
          if (recipe) {
            totals.p += recipe.p;
            totals.c += recipe.c;
            totals.f += recipe.f;
            totals.k += recipe.k;
          }
        });
        return totals;
      };

        const key = `${selectedDate}_${suppId}`;
        setSupplementsDone(prev => ({
          ...prev,
          [key]: !prev[key]
        }));
      };

      const updateTracking = (key, value) => {
        setTracking(prev => ({
          ...prev,
          [key]: value
        }));
      };

      const daily = getDailyTotal();
      const proteinPercent = Math.min((daily.p / 100) * 100, 100);
      const kcalPercent = Math.min((daily.k / 1850) * 100, 100);

      const mealTypes = ['breakfast', 'snack1', 'lunch', 'snack2', 'dinner'];
      const mealLabels = ['Colazione', 'Spuntino 1', 'Pranzo', 'Spuntino 2', 'Cena'];

            </button>
            <button className={`tab-button ${currentTab === 'beauty' ? 'active' : ''}`} onClick={() => setCurrentTab('beauty')}>
              💄 Beauty Routine
            </button>
            <button className={`tab-button ${currentTab === 'shopping' ? 'active' : ''}`} onClick={() => setCurrentTab('shopping')}>
              🛒 Shopping
            </button>
            <button className={`tab-button ${currentTab === 'tracking' ? 'active' : ''}`} onClick={() => setCurrentTab('tracking')}>
              📊 Tracking
            </button>
          </div>

          {currentTab === 'dieta' && (
            <>
              <div className="date-selector">
                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} />
                <button onClick={() => setSelectedDate(new Date().toISOString().split('T')[0])}>Oggi</button>
              </div>

              <div className="week-indicator">
                📅 SETTIMANA {week} — Giorno {dateIndex} di 28
              </div>

              <div className="card-grid">
                {mealTypes.map((type, idx) => {
                  const recipe = getMealRecipe(type, dayMeals[type]);
                  return (
                    <div key={type} className="card">
                      <div className="card-header">{mealLabels[idx]}</div>
                      {recipe && (
                        <>
                          <div className="meal-items">
                            <div className="meal-item">
                              <div className="meal-item-info">
                                <div className="meal-item-name">{recipe.name}</div>
                                <div className="meal-item-macro">P:{recipe.p}g | C:{recipe.c}g | F:{recipe.f}g</div>
                              </div>
                            </div>
                          </div>
                          <div className="meal-summary">
                            <div className="summary-line">Proteina: <strong>{recipe.p}g</strong></div>
                            <div className="summary-line">Carbs: <strong>{recipe.c}g</strong></div>
                            <div className="summary-line">Grassi: <strong>{recipe.f}g</strong></div>
                            <div className="summary-line"><strong style={{color: 'var(--primary)'}}>Kcal: {recipe.k}</strong></div>
                          </div>
                        </>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="daily-totals">
                <h2>📊 Totale Giornaliero</h2>
                <div className="totals-grid">
                  <div className="total-item">
                    <div className="total-label">Proteina</div>
                    <div className="total-value">{daily.p}g</div>
                    <div className="progress-bar">
                      <div className={`progress-fill ${proteinPercent >= 90 ? 'success' : ''}`} style={{width: `${proteinPercent}%`}}></div>
                    </div>
                  </div>
                  <div className="total-item">
                    <div className="total-label">Carbs</div>
                    <div className="total-value">{daily.c}g</div>
                  </div>
                  <div className="total-item">
                    <div className="total-label">Grassi</div>
                    <div className="total-value">{daily.f}g</div>
                  </div>
                  <div className="total-item">
                    <div className="total-label">Kcal</div>
                    <div className="total-value">{daily.k}</div>
                    <div className="progress-bar">
                      <div className={`progress-fill ${kcalPercent >= 90 ? 'success' : ''}`} style={{width: `${kcalPercent}%`}}></div>
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

          {currentTab === 'integratori' && (
            <>
              <div className="date-selector">
                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} />
                <button onClick={() => setSelectedDate(new Date().toISOString().split('T')[0])}>Oggi</button>
              </div>

              <div className="week-indicator">
                💊 INTEGRATORI GIORNALIERI — Giorno {dateIndex}
              </div>

              <div className="card">
                <div className="supplement-list">
                  {supplements.map(supp => {
                    const key = `${selectedDate}_${supp.id}`;
                    const done = supplements_done[key] || false;
                    return (
                      <div key={supp.id} className="supplement-item">
                        <div className="supplement-info">
                          <h4>{supp.icon} {supp.name}</h4>
                          <p>{supp.dose} • {supp.time}</p>
                        </div>
                        <div className={`supplement-check ${done ? 'done' : ''}`} onClick={() => toggleSupplementDone(supp.id)}>
                          {done ? '✓' : ''}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}

          {currentTab === 'beauty' && (
            <>
              <div className="week-indicator">
                💄 BEAUTY ROUTINE SKINCARE — Pelle Sensibile 41 Anni
              </div>

              <div className="skincare-routine">
                <div className="skincare-period">
                  <h3>🌅 MATTINA (5 min totali)</h3>
                  {skincareRoutine.morning.map(step => (
                    <div key={step.step} className="skincare-step">
                      <div className="step-number">{step.step}</div>
                      <div className="step-details">
                        <h4>{step.action}</h4>
                        <p>{step.time}</p>
                        <div className="product">Prodotto: {step.product}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="skincare-period">
                  <h3>🌙 SERA (10 min totali)</h3>
                  {skincareRoutine.evening.map(step => (
                    <div key={step.step} className="skincare-step">
                      <div className="step-number">{step.step}</div>
                      <div className="step-details">
                        <h4>{step.action}</h4>
                        <p>{step.time}</p>
                        <div className="product">Prodotto: {step.product}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="card">
                  <h3>📝 Note Importanti</h3>
                  <ul style={{fontSize: '13px', lineHeight: '1.6', marginLeft: '1.5rem'}}>
                    <li>Retinolo: Inizia 1x/settimana, aumenta gradualmente a 3x/week (lun/mer/ven)</li>
                    <li>SPF 50+ SEMPRE (anche in casa, UVA passa vetri)</li>
                    <li>Texture sensibile: No profumi forti, preservativi minimi</li>
                    <li>Attesa 2-3 min tra step per assorbimento</li>
                    <li>Risultati: 4-8 settimane per ridurre rughe fine, 12 settimane per risultati significativi</li>
                  </ul>
                </div>
              </div>
            </>
          )}

          {currentTab === 'shopping' && (
            <>
              <div className="week-indicator">
                🛒 SHOPPING LIST — Settimana {week}
              </div>

              <div style={{marginBottom: '2rem'}}>
                <h2 style={{marginBottom: '1rem'}}>🥘 Ingredienti Alimentari</h2>
                <div className="shopping-grid">
                  {['Petto pollo', 'Uova', 'Salmone', 'Pesce', 'Riso integrale', 'Pasta integrale', 'Verdure miste', 'Frutta', 'Yogurt greco', 'Latte'].map((item, idx) => (
                    <div key={idx} className="shopping-item">
                      <div className="shopping-item-info">
                        <h4>{item}</h4>
                        <p>Quantità settimanale</p>
                      </div>
                      <div className="checkbox" onClick={() => updateTracking(`shop_${idx}`, !tracking[`shop_${idx}`])}></div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{marginBottom: '2rem'}}>
                <h2 style={{marginBottom: '1rem'}}>💊 Integratori</h2>
                <div className="shopping-grid">
                  {['Omega-3', 'Vitamina D3', 'Magnesio', 'B12', 'Multivit', 'Collagene', 'Vitamina C', 'Zinco'].map((item, idx) => (
                    <div key={idx} className="shopping-item">
                      <div className="shopping-item-info">
                        <h4>{item}</h4>
                        <p>Riordina se finito</p>
                      </div>
                      <div className="checkbox" onClick={() => updateTracking(`supp_${idx}`, !tracking[`supp_${idx}`])}></div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h2 style={{marginBottom: '1rem'}}>💄 Beauty Products</h2>
                <div className="shopping-grid">
                  {['Cleanser', 'Toner', 'Siero Vit C', 'Retinol', 'Moisturizer', 'Eye Cream', 'SPF 50+', 'Oil cleanser'].map((item, idx) => (
                    <div key={idx} className="shopping-item">
                      <div className="shopping-item-info">
                        <h4>{item}</h4>
                        <p>Verifica scadenza</p>
                      </div>
                      <div className="checkbox" onClick={() => updateTracking(`beauty_${idx}`, !tracking[`beauty_${idx}`])}></div>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}

          {currentTab === 'tracking' && (
            <>
              <div className="week-indicator">
                📊 TRACKING PERSONALE — Giorno {dateIndex}
              </div>

              <div className="tracking-section">
                <div className="tracking-card">
                  <h3>⚖️ Peso (kg)</h3>
                  <input 
                    type="number" 
                    placeholder="es. 49.2" 
                    step="0.1"
                    className="tracking-input"
                    value={tracking[`weight_${selectedDate}`] || ''}
                    onChange={(e) => updateTracking(`weight_${selectedDate}`, e.target.value)}
                  />
                </div>

                <div className="tracking-card">
                  <h3>😊 Umore (1-10)</h3>
                  <input 
                    type="number" 
                    min="1" 
                    max="10"
                    className="tracking-input"
                    value={tracking[`mood_${selectedDate}`] || ''}
                    onChange={(e) => updateTracking(`mood_${selectedDate}`, e.target.value)}
                  />
                </div>

                <div className="tracking-card">
                  <h3>⚡ Energia (1-10)</h3>
                  <input 
                    type="number" 
                    min="1" 
                    max="10"
                    className="tracking-input"
                    value={tracking[`energy_${selectedDate}`] || ''}
                    onChange={(e) => updateTracking(`energy_${selectedDate}`, e.target.value)}
                  />
                </div>

                <div className="tracking-card">
                  <h3>💤 Sonno (ore)</h3>
                  <input 
                    type="number" 
                    placeholder="es. 7.5" 
                    step="0.5"
                    className="tracking-input"
                    value={tracking[`sleep_${selectedDate}`] || ''}
                    onChange={(e) => updateTracking(`sleep_${selectedDate}`, e.target.value)}
                  />
                </div>

                <div className="tracking-card">
                  <h3>✨ Pelle Oggi (note)</h3>
                  <input 
                    type="text" 
                    placeholder="es. Luminosa, meno rossori" 
                    className="tracking-input"
                    value={tracking[`skin_${selectedDate}`] || ''}
                    onChange={(e) => updateTracking(`skin_${selectedDate}`, e.target.value)}
                  />
                </div>

                <div className="tracking-card">
                  <h3>💪 Pilates completato?</h3>
                  <div style={{display: 'flex', gap: '0.5rem'}}>
                    <button 
                      onClick={() => updateTracking(`pilates_${selectedDate}`, 'yes')}
                      style={{flex: 1, padding: '0.75rem', background: tracking[`pilates_${selectedDate}`] === 'yes' ? 'var(--success)' : 'var(--surface-1)', color: tracking[`pilates_${selectedDate}`] === 'yes' ? 'white' : 'var(--text-primary)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: '600'}}
                    >
                      ✓ Sì
                    </button>
                    <button 
                      onClick={() => updateTracking(`pilates_${selectedDate}`, 'no')}
                      style={{flex: 1, padding: '0.75rem', background: tracking[`pilates_${selectedDate}`] === 'no' ? 'var(--danger)' : 'var(--surface-1)', color: tracking[`pilates_${selectedDate}`] === 'no' ? 'white' : 'var(--text-primary)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: '600'}}
                    >
                      ✕ No
                    </button>
                  </div>
                </div>
              </div>
            </>
          )}

          <div className="footer">
            Moglie 4 Settimane • Dieta + Integratori + Beauty • Auto-save offline
          </div>
        </>
      );
    };

    ReactDOM.render(<App />, document.getElementById('app'));
  </script>
</body>
</html>
